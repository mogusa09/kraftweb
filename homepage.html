<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随手记</title>
<style>
body{font-family:serif;max-width:640px;margin:48px auto;padding:0 20px;color:#333;line-height:1.8}
h1{font-size:22px;border-bottom:1px solid #ddd;padding-bottom:8px}
li{margin:10px 0}
small{color:#999}
</style>
</head>
<body>
<h1>随手记</h1>
<p><small>想到什么，随手记下来。</small></p>
<ul>
<li>周三去市场买菜，顺便带一包挂面。</li>
<li>阳台那盆薄荷长得太快了，该剪一剪。</li>
<li>把书架第二层整理一下，旧杂志收进箱子。</li>
<li>下周记得给花换一次水。</li>
</ul>
<p><small>—— 写于一个普通的下午</small></p>
</body>
</html>
